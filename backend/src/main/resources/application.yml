spring:
  application:
    name: asset-guardian-backend
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cart_rio_hub}
    username: ${DB_USERNAME:cart_rio}
    password: ${DB_PASSWORD:cart_rio}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: inventory
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: inventory
    schemas: inventory

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost}
  bootstrap:
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:admin123}
    operator-username: ${APP_OPERATOR_USERNAME:operadora}
    operator-password: ${APP_OPERATOR_PASSWORD:operadora123}
