services:
  postgres:
    image: postgres:16-alpine
    container_name: asset-guardian-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asset_guardian}
      POSTGRES_USER: ${POSTGRES_USER:-asset_guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asset_guardian}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asset_guardian} -d ${POSTGRES_DB:-asset_guardian}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: asset-guardian-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-asset_guardian}
      DB_USERNAME: ${POSTGRES_USER:-asset_guardian}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-asset_guardian}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:8080}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
      APP_OPERATOR_USERNAME: ${APP_OPERATOR_USERNAME:-operadora}
      APP_OPERATOR_PASSWORD: ${APP_OPERATOR_PASSWORD:-operadora123}
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx512m}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asset-guardian-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

volumes:
  postgres_data:
