    <line x1="59" y1="10" x2="59" y2="40"/>
    <line x1="84" y1="10" x2="84" y2="40"/>
    <line x1="109" y1="10" x2="109" y2="40"/>
    <line x1="134" y1="10" x2="134" y2="40"/>
